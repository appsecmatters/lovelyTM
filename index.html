<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiteTM — Lightweight Threat Modeling</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <style>
    body { background: #f8f9fa; }

    #mainPanel {
      padding: 24px;
      overflow-x: auto;
    }

    #diagramWrapper {
      position: relative;
      display: inline-block;
      min-width: 100%;
    }

    #strideOverlay {
      position: absolute;
      top: 0; left: 0;
      pointer-events: none;
      width: 100%;
      height: 100%;
    }

    .stride-annotation {
      position: absolute;
      pointer-events: auto;
      transform: translateX(-50%);
      white-space: nowrap;
      line-height: 1;
    }

    .stride-letter-cell {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
    }

    .stride-question {
      font-size: 0.75rem;
      font-weight: 900;
      color: #6c757d;
      line-height: 1;
      margin-top: 1px;
    }

    .stride-letter {
      display: inline-block;
      cursor: pointer;
      margin: 0 1px;
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 0.7rem;
      font-weight: 700;
      user-select: none;
      transition: opacity 0.15s;
      border: 1px solid transparent;
    }
    .stride-letter:hover { opacity: 0.72; }

    .stride-na       { background: #e9ecef; color: #212529; border-color: #adb5bd; }
    .stride-none     { background: #d1e7dd; color: #0f5132; border-color: #a3cfbb; }
    .stride-low      { background: #ffc107; color: #212529; border-color: #e0a800; }
    .stride-medium   { background: #fd7e14; color: #fff;    border-color: #dc6502; }
    .stride-high     { background: #dc3545; color: #fff;    border-color: #b02a37; }
    .stride-critical { background: #6f42c1; color: #fff;    border-color: #59339d; }

    .help-icon {
      cursor: help;
      font-size: 0.75em;
      color: #0d6efd;
      margin-left: 4px;
      vertical-align: middle;
    }

    .help-tooltip .tooltip-inner {
      max-width: 360px;
      text-align: left;
    }

    #crashCourseBody h3 {
      font-size: 1rem;
      font-weight: 700;
      margin-top: 1.25rem;
      margin-bottom: 0.4rem;
    }
    #crashCourseBody h3:first-child { margin-top: 0; }
    #crashCourseBody ul { margin-bottom: 0; }
    #crashCourseBody li > p { margin-bottom: 0.15rem; }

    .scenario-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 6px 0;
      border-bottom: 1px solid #dee2e6;
      gap: 8px;
    }
    .scenario-row:last-child { border-bottom: none; }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand navbar-dark bg-dark px-3 py-2">
  <span class="navbar-brand fw-bold me-4">🔒 LiteTM</span>
  <div class="d-flex gap-2">
    <button class="btn btn-outline-light btn-sm" id="importBtn">📥 Import Sequence Diagram</button>
    <button class="btn btn-outline-light btn-sm" id="importJsonBtn">📂 Import existing JSON</button>
    <button class="btn btn-outline-light btn-sm" id="exportBtn">📤 Export</button>
    <button class="btn btn-outline-info btn-sm" id="crashCourseBtn">📖 Crash Course</button>
    <button class="btn btn-outline-info btn-sm" id="riskScoringBtn">📊 Risk Scoring</button>
  </div>
  <input type="file" id="importJsonInput" accept=".json" style="display:none">
</nav>

<!-- Main Panel -->
<div id="mainPanel">
  <div id="emptyState" class="text-center text-muted py-5">
    <p class="fs-5">Click <strong>Import Sequence Diagram</strong> to get started.</p>
    <p class="small">Paste a Mermaid <code>sequenceDiagram</code> and annotate arrows with STRIDE security concerns.</p>
  </div>
  <div id="diagramWrapper" style="display:none;">
    <div id="diagramContainer"></div>
    <div id="strideOverlay"></div>
  </div>
</div>

<!-- ===== Import Modal ===== -->
<div class="modal fade" id="importModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Import Sequence Diagram</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted small mb-2">Paste a <a href="https://mermaid.js.org/syntax/sequenceDiagram.html" target="_blank">Mermaid sequence diagram</a>:</p>
        <textarea class="form-control font-monospace" id="diagramInput" rows="14"
          placeholder="sequenceDiagram&#10;    participant Client&#10;    participant Server&#10;    Client->>Server: Login request&#10;    Server-->>Client: Auth token"></textarea>
        <div class="alert alert-danger mt-2 mb-0" id="importError" style="display:none;"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="importConfirmBtn">Render Diagram</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== Export Modal ===== -->
<div class="modal fade" id="exportModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Export Threat Model</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <label for="exportFilename" class="form-label">Filename:</label>
        <div class="input-group">
          <input type="text" class="form-control" id="exportFilename" value="threat-model">
          <span class="input-group-text">.json</span>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="exportConfirmBtn">Download JSON</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== Risk Scoring Modal ===== -->
<div class="modal fade" id="riskScoringModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Risk Scoring</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="riskScoringBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== Crash Course Modal ===== -->
<div class="modal fade" id="crashCourseModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">STRIDE Threat Modeling — Crash Course</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="crashCourseBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== STRIDE Modal ===== -->
<div class="modal fade" id="strideModal" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="strideModalTitle"></h5>
        <button type="button" class="btn-close" id="strideModalCloseBtn"></button>
      </div>
      <div class="modal-body" id="strideModalBody"></div>
      <div class="modal-footer" id="strideModalFooter"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<script src="risk_scoring.js"></script>
<script src="app.js"></script>
</body>
</html>
